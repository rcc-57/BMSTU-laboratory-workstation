name: Measurement Control Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'measurement_app/**'
      - '.github/workflows/measurement-windows.yml'
  pull_request:
    paths:
      - 'measurement_app/**'
      - '.github/workflows/measurement-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build from source and run protocol tests
        shell: powershell
        run: ./measurement_app/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: measurement-control-windows-x64
          path: |
            build/measurement-windows/Release/measurement_control.exe
            measurement_app/README_how_to_start.md
          if-no-files-found: error
